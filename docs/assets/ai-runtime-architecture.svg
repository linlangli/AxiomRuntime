<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">企业级 AI Runtime 产品完整架构图</title>
  <desc id="desc">展示用户与运营者、接入面、企业控制面、运行时执行主链、唯一传输代理、自动记忆学习闭环、可替换适配器和权威数据存储之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; letter-spacing: 0; }
      .page-title { font-size: 30px; font-weight: 600; }
      .subtitle { font-size: 15px; fill: #526071; }
      .section-title { font-size: 18px; font-weight: 600; }
      .node-title { font-size: 15px; font-weight: 600; }
      .node-body { font-size: 12px; fill: #526071; }
      .small { font-size: 11px; fill: #526071; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #047857; stroke-width: 2; marker-end: url(#arrow-green); }
      .edge-orange { fill: none; stroke: #c2410c; stroke-width: 2; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1800" height="1500" fill="#ffffff"/>
  <text x="60" y="55" class="page-title">企业级 AI Runtime 产品完整架构</text>
  <text x="60" y="84" class="subtitle">产品主线：统一执行 → 受治理记忆 → 可验证学习 → 组织能力沉淀</text>

  <!-- Product actors and canonical contracts -->
  <rect x="70" y="115" width="330" height="72" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="235" y="143" text-anchor="middle" class="node-title">业务使用者</text>
  <text x="235" y="168" text-anchor="middle" class="node-body">开发者 · 知识工作者 · Agent 使用者</text>

  <rect x="510" y="115" width="760" height="72" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="890" y="143" text-anchor="middle" class="node-title">L0 Contracts 零依赖权威契约</text>
  <text x="890" y="168" text-anchor="middle" class="node-body">PrincipalRef · ScopeRef · RuntimeEvent · PolicyDecision · CapabilityInvocation · OrganizationPolicySnapshot</text>

  <rect x="1400" y="115" width="330" height="72" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1565" y="143" text-anchor="middle" class="node-title">平台运营者</text>
  <text x="1565" y="168" text-anchor="middle" class="node-body">平台管理员 · AI 运维 · 安全人员 · 审计人员</text>

  <!-- Control plane -->
  <rect x="45" y="230" width="420" height="710" rx="8" fill="#f7fffb" stroke="#059669" stroke-width="2"/>
  <text x="70" y="264" class="section-title">企业控制面 Enterprise Control Plane</text>
  <text x="70" y="288" class="small">治理组织与环境，不承载模型请求转发</text>

  <rect x="75" y="315" width="360" height="82" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="341" text-anchor="middle" class="node-title">组织、租户与环境</text>
  <text x="255" y="364" text-anchor="middle" class="node-body">Organization · Tenant · Project · Environment</text>
  <text x="255" y="382" text-anchor="middle" class="node-body">生命周期 · 数据边界 · 委派管理</text>

  <rect x="75" y="420" width="360" height="82" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="446" text-anchor="middle" class="node-title">身份与角色</text>
  <text x="255" y="469" text-anchor="middle" class="node-body">OIDC / SAML · SCIM · RoleBinding</text>
  <text x="255" y="487" text-anchor="middle" class="node-body">IdentityDirectoryPort · 紧急授权</text>

  <rect x="75" y="525" width="360" height="82" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="551" text-anchor="middle" class="node-title">策略与审批</text>
  <text x="255" y="574" text-anchor="middle" class="node-body">草稿 · 校验 · 审批 · 灰度</text>
  <text x="255" y="592" text-anchor="middle" class="node-body">生效策略 · 发布 · 回滚</text>

  <rect x="75" y="630" width="360" height="82" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="656" text-anchor="middle" class="node-title">能力与插件治理</text>
  <text x="255" y="679" text-anchor="middle" class="node-body">发现 · 校验 · 审批 · 激活</text>
  <text x="255" y="697" text-anchor="middle" class="node-body">排空 · 禁用 · 替换 · 移除</text>

  <rect x="75" y="735" width="360" height="82" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="761" text-anchor="middle" class="node-title">FinOps 与可靠性</text>
  <text x="255" y="784" text-anchor="middle" class="node-body">配额 · 预算 · 归因 · SLO</text>
  <text x="255" y="802" text-anchor="middle" class="node-body">备份 · 恢复 · RTO · RPO</text>

  <rect x="75" y="840" width="360" height="72" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="255" y="866" text-anchor="middle" class="node-title">合规与审计</text>
  <text x="255" y="889" text-anchor="middle" class="node-body">数据驻留 · 保留策略 · 法律保留 · 审计导出</text>

  <!-- Runtime -->
  <rect x="500" y="230" width="770" height="710" rx="8" fill="#f8fbff" stroke="#2563eb" stroke-width="2"/>
  <text x="525" y="264" class="section-title">AI Runtime 执行与能力平面</text>
  <text x="525" y="288" class="small">所有接入面共享同一条受治理执行生命周期</text>

  <rect x="535" y="315" width="700" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="885" y="341" text-anchor="middle" class="node-title">Surfaces 接入面</text>
  <text x="885" y="366" text-anchor="middle" class="node-body">CLI · Telegram · Web · Desktop · API · Scheduler</text>

  <rect x="535" y="410" width="700" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="885" y="437" text-anchor="middle" class="node-title">Orchestration 编排</text>
  <text x="885" y="460" text-anchor="middle" class="node-body">身份 · 租户 · Scope · 会话 · Trace · 工作记忆 · 生命周期</text>

  <rect x="535" y="510" width="700" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="885" y="537" text-anchor="middle" class="node-title">Capabilities + Registry 能力层</text>
  <text x="885" y="560" text-anchor="middle" class="node-body">Provider 路由 · 模型 · 记忆 · 知识 · Skill · Workflow · Tool · 报告</text>

  <rect x="535" y="610" width="700" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="885" y="637" text-anchor="middle" class="node-title">Execution Kernel 执行内核</text>
  <text x="885" y="660" text-anchor="middle" class="node-body">权限 · 幂等 · 重试 · 取消 · 隔离 · 补偿 · 副作用控制</text>

  <rect x="535" y="710" width="700" height="92" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="885" y="737" text-anchor="middle" class="node-title">Single Runtime Transport Proxy 唯一数据平面</text>
  <text x="885" y="760" text-anchor="middle" class="node-body">传输核心 · 路由租约 · 流式传输 · 兼容转换 · TransformCoordinator</text>
  <text x="885" y="782" text-anchor="middle" class="node-body">每次 execution：一个 listener · 一条上游路由 · 一个变换协调器</text>

  <rect x="535" y="825" width="330" height="82" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="700" y="852" text-anchor="middle" class="node-title">UsageObserver</text>
  <text x="700" y="875" text-anchor="middle" class="node-body">Usage / Cost / Metrics 唯一写入者</text>
  <text x="700" y="893" text-anchor="middle" class="node-body">Memory 不得复制计量账本</text>

  <rect x="905" y="825" width="330" height="82" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="1070" y="852" text-anchor="middle" class="node-title">MemoryExtension</text>
  <text x="1070" y="875" text-anchor="middle" class="node-body">预读取 · 脱敏捕获 · 持久入队</text>
  <text x="1070" y="893" text-anchor="middle" class="node-body">不是第二个 Proxy，不拥有 listener</text>

  <rect x="565" y="922" width="280" height="42" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="705" y="948" text-anchor="middle" class="node-title">Policy Engine：确定性判定</text>
  <rect x="925" y="922" width="280" height="42" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1065" y="948" text-anchor="middle" class="node-title">Security：密钥 · DLP · 隔离</text>

  <!-- Intelligence loop -->
  <rect x="1300" y="230" width="455" height="710" rx="8" fill="#fffaf5" stroke="#ea580c" stroke-width="2"/>
  <text x="1325" y="264" class="section-title">自动记忆与受治理学习闭环</text>
  <text x="1325" y="288" class="small">模型提出候选，Policy 与人类决定激活</text>

  <rect x="1330" y="315" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="340" text-anchor="middle" class="node-title">RuntimeEvent → LearningSignal</text>
  <text x="1527" y="361" text-anchor="middle" class="node-body">执行结果 · 纠错 · 成本 · 延迟 · Policy 证据</text>

  <rect x="1330" y="398" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="423" text-anchor="middle" class="node-title">Learning Governor</text>
  <text x="1527" y="444" text-anchor="middle" class="node-body">目标 · 不确定性 · 预算 · 确定性决策</text>

  <rect x="1330" y="481" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="506" text-anchor="middle" class="node-title">ADD-only Candidate</text>
  <text x="1527" y="527" text-anchor="middle" class="node-body">知识 · 记忆 · Skill · Workflow · Capability</text>

  <rect x="1330" y="564" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="589" text-anchor="middle" class="node-title">验证与评测</text>
  <text x="1527" y="610" text-anchor="middle" class="node-body">回放 · 沙箱 · 影子验证 · EvaluationResult</text>

  <rect x="1330" y="647" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="672" text-anchor="middle" class="node-title">Policy / 人工晋升</text>
  <text x="1527" y="693" text-anchor="middle" class="node-body">激活 · Scope 晋升 · 回滚 · 弃用</text>

  <rect x="1330" y="730" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="755" text-anchor="middle" class="node-title">权威 Memory Ledger</text>
  <text x="1527" y="776" text-anchor="middle" class="node-body">Claim · Evidence · Episode · Derivation · Event</text>

  <rect x="1330" y="813" width="395" height="62" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1527" y="838" text-anchor="middle" class="node-title">召回 + Context Compiler</text>
  <text x="1527" y="859" text-anchor="middle" class="node-body">混合检索 · 时序 · 压缩 · Memory Blocks</text>

  <rect x="1330" y="896" width="395" height="42" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1527" y="922" text-anchor="middle" class="node-title">CapabilityGain：质量提升且安全不回退</text>

  <!-- Replaceable adapters -->
  <rect x="45" y="995" width="1710" height="170" rx="8" fill="#faf8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="1028" class="section-title">可替换 Adapters 与成熟能力</text>
  <text x="70" y="1051" class="small">Runtime 自持权威语义；通用引擎通过稳定 Port 采纳或适配</text>

  <rect x="75" y="1070" width="390" height="66" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="270" y="1095" text-anchor="middle" class="node-title">模型 / Provider / Agent Adapter</text>
  <text x="270" y="1118" text-anchor="middle" class="node-body">Claude · Codex · Hermes · Hosted Models</text>

  <rect x="500" y="1070" width="390" height="66" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="695" y="1095" text-anchor="middle" class="node-title">Tool / MCP / 浏览器 Adapter</text>
  <text x="695" y="1118" text-anchor="middle" class="node-body">企业系统 · SaaS · 本地工具</text>

  <rect x="925" y="1070" width="390" height="66" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1120" y="1095" text-anchor="middle" class="node-title">成熟智能能力 Provider</text>
  <text x="1120" y="1118" text-anchor="middle" class="node-body">抽取 · 检索 · 向量 · 时序图 · 评估</text>

  <rect x="1350" y="1070" width="375" height="66" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1537" y="1095" text-anchor="middle" class="node-title">企业系统 Adapter</text>
  <text x="1537" y="1118" text-anchor="middle" class="node-body">OIDC/SAML · SCIM · OPA/Cedar · SIEM · FinOps</text>

  <!-- Data -->
  <rect x="45" y="1205" width="1710" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="70" y="1238" class="section-title">Runtime 数据与 Storage：权威数据和可重建投影</text>

  <rect x="75" y="1260" width="390" height="92" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="270" y="1287" text-anchor="middle" class="node-title">配置与控制面版本</text>
  <text x="270" y="1310" text-anchor="middle" class="node-body">组织 · Policy · Capability Registry</text>
  <text x="270" y="1330" text-anchor="middle" class="node-body">不可变版本 · 审批证据</text>

  <rect x="500" y="1260" width="390" height="92" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="695" y="1287" text-anchor="middle" class="node-title">权威账本</text>
  <text x="695" y="1310" text-anchor="middle" class="node-body">用量账本 · 审计事件日志</text>
  <text x="695" y="1330" text-anchor="middle" class="node-body">Claim / Evidence · Purge Tombstone</text>

  <rect x="925" y="1260" width="390" height="92" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1120" y="1287" text-anchor="middle" class="node-title">可恢复执行状态</text>
  <text x="1120" y="1310" text-anchor="middle" class="node-body">检查点 · 持久任务 · 导出操作</text>
  <text x="1120" y="1330" text-anchor="middle" class="node-body">幂等键 · 租约 · 重试 · 死信</text>

  <rect x="1350" y="1260" width="375" height="92" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1537" y="1287" text-anchor="middle" class="node-title">存储机制与投影</text>
  <text x="1537" y="1310" text-anchor="middle" class="node-body">SQL · FTS · Vector · Graph · ObjectStore</text>
  <text x="1537" y="1330" text-anchor="middle" class="node-body">SecretStore · KMS/HSM · Telemetry</text>

