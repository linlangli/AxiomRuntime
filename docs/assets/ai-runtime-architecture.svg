  <!-- Ownership callouts -->
  <text x="60" y="1435" class="small">实线：运行或治理调用　　虚线：契约约束　　绿色：企业控制　　橙色：记忆与学习闭环</text>
  <text x="60" y="1463" class="small">权威边界：UsageObserver 独占用量账本；Memory 独占 Claim/Evidence 语义；Policy 独占规则与决策；Storage 只提供机制；Adapter 不拥有 Runtime 权威。</text>
</svg>
