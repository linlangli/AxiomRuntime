name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  publish_npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) must match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm install --global npm@11.11.0
      - run: npm ci --prefer-offline
      - run: npm --prefix web ci --prefer-offline
      - run: npm test
      - run: npm --prefix web run typecheck
      - run: npm run smoke:package
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance --ignore-scripts
