image: node:22.19.0

stages:
  - test
  - build
  - deploy
  - publish
  - distribute

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  DEPLOY_PATH: "/opt/AxiomRuntime"
  CODEX_CLI_VERSION: "0.145.0"
  CLAUDE_CODE_VERSION: "2.1.129"
  HOMEBREW_TAP_BRANCH: "main"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - npm test

build_image:
  stage: build
  image: docker:29-cli
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull --build-arg "CODEX_VERSION=$CODEX_CLI_VERSION" --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

deploy_production:
  stage: deploy
  cache: []
  tags:
    - axiomruntime-prod
  before_script:
    - docker info >/dev/null
  needs:
    - test
    - build_image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never
  resource_group: axiomruntime-production
  environment:
    name: production
  interruptible: false
  script:
    - |
      export DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      export REMOTE_DOCKER_CONFIG="$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID"
      install -d -m 0700 "$REMOTE_DOCKER_CONFIG"
      install -m 0640 deploy/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml.next"
      install -m 0750 deploy/remote-deploy.sh "$DEPLOY_PATH/remote-deploy.sh.next"
      printf '%s' "$CI_REGISTRY_PASSWORD" | DOCKER_CONFIG="$REMOTE_DOCKER_CONFIG" docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      "$DEPLOY_PATH/remote-deploy.sh.next" "$DEPLOY_PATH" "$DEPLOY_IMAGE" "$CI_REGISTRY" "$REMOTE_DOCKER_CONFIG"
      mv "$DEPLOY_PATH/remote-deploy.sh.next" "$DEPLOY_PATH/remote-deploy.sh"
  after_script:
    - |
      rm -f -- "$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID/config.json"
      rmdir -- "$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID" 2>/dev/null || true

publish_npm:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  script:
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is required. Add it in GitLab CI/CD variables."
        exit 1
      fi
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
        echo "Tag $CI_COMMIT_TAG does not point to a commit contained in origin/$CI_DEFAULT_BRANCH."
        exit 1
      fi
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      PACKAGE_VERSION="$(node -p "require('./package.json').version")"
      if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
        echo "Tag version ($TAG_VERSION) must match package.json version ($PACKAGE_VERSION)."
        exit 1
      fi
    - npm run release:check
    - npm pack --dry-run
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --access public

publish_homebrew:
  stage: distribute
  image: alpine:3.23
  cache: []
  before_script: []
  needs:
    - publish_npm
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  script:
    - apk add --no-cache ca-certificates curl git
    - |
      if [ -z "$HOMEBREW_TAP_PUSH_URL" ]; then
        echo "HOMEBREW_TAP_PUSH_URL is required and must be a masked CI variable with write access to the Tap repository."
        exit 1
      fi
    - |
      FORMULA_URL="$(sed -n 's/^  url "\(.*\)"$/\1/p' Formula/axiomruntime.rb)"
      FORMULA_SHA="$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' Formula/axiomruntime.rb)"
      curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$FORMULA_URL" --output /tmp/axiomruntime.tgz
      echo "$FORMULA_SHA  /tmp/axiomruntime.tgz" | sha256sum -c -
    - git clone --branch "$HOMEBREW_TAP_BRANCH" "$HOMEBREW_TAP_PUSH_URL" /tmp/homebrew-tap
    - install -D -m 0644 Formula/axiomruntime.rb /tmp/homebrew-tap/Formula/axiomruntime.rb
    - git -C /tmp/homebrew-tap config user.name "Axiom Runtime Release Bot"
    - git -C /tmp/homebrew-tap config user.email "release-bot@offerpilot.local"
    - git -C /tmp/homebrew-tap add Formula/axiomruntime.rb
    - |
      if git -C /tmp/homebrew-tap diff --cached --quiet; then
        echo "Homebrew Formula is already current."
      else
        git -C /tmp/homebrew-tap commit -m "axiomruntime ${CI_COMMIT_TAG#v}"
        git -C /tmp/homebrew-tap push origin "HEAD:$HOMEBREW_TAP_BRANCH"
      fi
