image: node:22.19.0

stages:
  - test
  - build
  - deploy
  - publish

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  DEPLOY_PATH: "/opt/agent-router"
  CODEX_CLI_VERSION: "0.145.0"
  CLAUDE_CODE_VERSION: "2.1.129"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - npm test

build_image:
  stage: build
  image: docker:29-cli
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull --build-arg "CODEX_VERSION=$CODEX_CLI_VERSION" --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

deploy_production:
  stage: deploy
  cache: []
  tags:
    - agent-router-prod
  before_script:
    - docker info >/dev/null
  needs:
    - test
    - build_image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  resource_group: agent-router-production
  environment:
    name: production
  interruptible: false
  script:
    - |
      export DEPLOY_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      export REMOTE_DOCKER_CONFIG="$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID"
      install -d -m 0700 "$REMOTE_DOCKER_CONFIG"
      install -m 0640 deploy/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml.next"
      install -m 0750 deploy/remote-deploy.sh "$DEPLOY_PATH/remote-deploy.sh.next"
      printf '%s' "$CI_REGISTRY_PASSWORD" | DOCKER_CONFIG="$REMOTE_DOCKER_CONFIG" docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      "$DEPLOY_PATH/remote-deploy.sh.next" "$DEPLOY_PATH" "$DEPLOY_IMAGE" "$CI_REGISTRY" "$REMOTE_DOCKER_CONFIG"
      mv "$DEPLOY_PATH/remote-deploy.sh.next" "$DEPLOY_PATH/remote-deploy.sh"
  after_script:
    - |
      rm -f -- "$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID/config.json"
      rmdir -- "$DEPLOY_PATH/.docker-auth-$CI_PIPELINE_ID" 2>/dev/null || true

publish_npm:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  script:
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is required. Add it in GitLab CI/CD variables."
        exit 1
      fi
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
        echo "Tag $CI_COMMIT_TAG does not point to a commit contained in origin/$CI_DEFAULT_BRANCH."
        exit 1
      fi
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      PACKAGE_VERSION="$(node -p "require('./package.json').version")"
      if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
        echo "Tag version ($TAG_VERSION) must match package.json version ($PACKAGE_VERSION)."
        exit 1
      fi
    - npm test
    - npm pack --dry-run
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --access public
